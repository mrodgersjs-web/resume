text-anchor="middle" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1.4" fill="#F5F0EB">RIG</text><text x="1090.0" y="190" text-anchor="middle" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.4" fill="#A09890">governed autonomous systems</text><text x="1090.0" y="242" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#C8A96E">2024</text><text x="44" y="386" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="0.8" fill="#A09890">military discipline → industrial scale → autonomy → clinical rigor → governed AI</text><text x="1156" y="386" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#A09890">2003 — PRESENT</text></svg>